server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Sonde de déploiement : healthz.json (sha cuit au build).
  location = /healthz.json {
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  # Données des challenges : JSON jamais mis en cache (le récap les fetch),
  # markdown lisible tel quel dans un navigateur.
  location ~ ^/challenges/.*\.json$ {
    default_type application/json;
    add_header Cache-Control "no-store";
  }
  location ~ ^/challenges/.*\.md$ {
    default_type text/plain;
    charset utf-8;
  }

  # Assets hashés d'Astro : cache long immuable.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # URLs propres (build.format: directory → /page/ ; fallback .html).
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
