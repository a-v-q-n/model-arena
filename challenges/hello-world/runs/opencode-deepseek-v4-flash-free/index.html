<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteur interactif</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 320px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 32px;
      color: #1a1a2e;
    }

    .counter {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 32px;
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      font-size: 1.25rem;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      min-width: 56px;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-increment,
    .btn-decrement {
      background: #eef2ff;
      color: #4338ca;
    }

    .btn-increment:hover,
    .btn-decrement:hover {
      background: #e0e7ff;
    }

    .btn-reset {
      background: #fef2f2;
      color: #dc2626;
    }

    .btn-reset:hover {
      background: #fee2e2;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Compteur interactif</h1>
    <div class="counter" id="counter">0</div>
    <div class="actions">
      <button class="btn-decrement" id="decrement">−</button>
      <button class="btn-increment" id="increment">+</button>
      <button class="btn-reset" id="reset">Reset</button>
    </div>
  </div>

  <script>
    const counterEl = document.getElementById('counter');
    const incrementBtn = document.getElementById('increment');
    const decrementBtn = document.getElementById('decrement');
    const resetBtn = document.getElementById('reset');

    let count = 0;

    function updateDisplay() {
      counterEl.textContent = count;
    }

    incrementBtn.addEventListener('click', () => {
      count++;
      updateDisplay();
    });

    decrementBtn.addEventListener('click', () => {
      if (count > 0) {
        count--;
        updateDisplay();
      }
    });

    resetBtn.addEventListener('click', () => {
      count = 0;
      updateDisplay();
    });
  </script>
</body>
</html>
