<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
    overflow-x: hidden;
    position: relative;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 0% 20%, rgba(255, 0, 128, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 80%, rgba(0, 200, 255, 0.2) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(120, 0, 255, 0.15) 0%, transparent 60%);
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    z-index: 0;
    animation: orbFloat 20s ease-in-out infinite;
  }

  .orb:nth-child(1) {
    width: 400px;
    height: 400px;
    background: #ff0080;
    top: -100px;
    left: -100px;
    animation-delay: 0s;
  }

  .orb:nth-child(2) {
    width: 350px;
    height: 350px;
    background: #7000ff;
    bottom: -80px;
    right: -80px;
    animation-delay: -7s;
  }

  .orb:nth-child(3) {
    width: 250px;
    height: 250px;
    background: #00d4ff;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: -14s;
  }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(60px, -40px) scale(1.1); }
    50% { transform: translate(-30px, 60px) scale(0.9); }
    75% { transform: translate(40px, 30px) scale(1.05); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    padding: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 48px 40px;
    box-shadow:
      0 8px 40px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: transform 0.3s ease, box-shadow 0.4s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow:
      0 16px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 100px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: linear-gradient(135deg, rgba(255, 0, 128, 0.2), rgba(120, 0, 255, 0.2));
    color: #ff66b2;
    border: 1px solid rgba(255, 0, 128, 0.15);
    margin-bottom: 16px;
  }

  .header h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 30%, #a78bfa 70%, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }

  .header p {
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
    margin-top: 8px;
    font-weight: 400;
  }

  .form-group {
    margin-bottom: 20px;
    position: relative;
  }

  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
    transition: color 0.3s ease;
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: rgba(255, 255, 255, 0.25);
    transition: color 0.3s ease;
    pointer-events: none;
  }

  .input-wrap textarea ~ .icon {
    top: 18px;
    transform: none;
  }

  .input-wrap input,
  .input-wrap textarea {
    width: 100%;
    padding: 14px 14px 14px 42px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    color: #fff;
    outline: none;
    transition: all 0.35s ease;
  }

  .input-wrap textarea {
    padding-left: 42px;
    min-height: 120px;
    resize: vertical;
    line-height: 1.5;
  }

  .input-wrap input::placeholder,
  .input-wrap textarea::placeholder {
    color: rgba(255, 255, 255, 0.2);
    font-weight: 400;
  }

  .input-wrap input:focus,
  .input-wrap textarea:focus {
    border-color: #a78bfa;
    background: rgba(255, 255, 255, 0.07);
    box-shadow:
      0 0 0 3px rgba(167, 139, 250, 0.12),
      0 4px 20px rgba(167, 139, 250, 0.08);
  }

  .input-wrap input:focus ~ .icon,
  .input-wrap textarea:focus ~ .icon {
    color: #a78bfa;
  }

  .input-wrap.error input,
  .input-wrap.error textarea {
    border-color: #f43f5e;
    background: rgba(244, 63, 94, 0.06);
    box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.1);
  }

  .input-wrap.error .icon {
    color: #f43f5e;
  }

  .input-wrap.success input,
  .input-wrap.success textarea {
    border-color: #22d3a0;
    background: rgba(34, 211, 160, 0.06);
  }

  .input-wrap.success .icon {
    color: #22d3a0;
  }

  .error-text {
    font-size: 0.75rem;
    color: #f43f5e;
    margin-top: 6px;
    display: none;
    align-items: center;
    gap: 4px;
    animation: shake 0.4s ease;
  }

  .error-text.show {
    display: flex;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  .btn {
    width: 100%;
    padding: 16px 24px;
    border: none;
    border-radius: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #ff0080, #7000ff, #00d4ff);
    background-size: 200% 200%;
    animation: gradientShift 4s ease infinite;
    transition: transform 0.25s ease, box-shadow 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    letter-spacing: 0.01em;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ff0080, #7000ff, #00d4ff);
    background-size: 200% 200%;
    animation: gradientShift 4s ease infinite;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 8px 30px rgba(255, 0, 128, 0.3),
      0 0 40px rgba(120, 0, 255, 0.15);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  .btn .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }

  .btn.loading .spinner {
    display: block;
  }

  .btn.loading .btn-text {
    opacity: 0.7;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .btn .arrow {
    display: inline-block;
    transition: transform 0.3s ease;
  }

  .btn:hover .arrow {
    transform: translateX(4px);
  }

  .success-msg {
    display: none;
    text-align: center;
    padding: 20px;
    animation: fadeInUp 0.5s ease;
  }

  .success-msg.show {
    display: block;
  }

  .success-msg .check {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #22d3a0, #10b981);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 1.5rem;
    color: #fff;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .success-msg h3 {
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }

  .success-msg p {
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    0% { transform: scale(0); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .form-body.hidden {
    display: none;
  }

  @media (max-width: 600px) {
    .container {
      padding: 12px;
    }

    .card {
      padding: 32px 24px;
      border-radius: 24px;
    }

    .header h1 {
      font-size: 1.6rem;
    }

    .orb {
      filter: blur(60px);
    }

    .orb:nth-child(1) {
      width: 250px;
      height: 250px;
    }

    .orb:nth-child(2) {
      width: 200px;
      height: 200px;
    }

    .orb:nth-child(3) {
      width: 150px;
      height: 150px;
    }
  }

  @media (max-width: 400px) {
    .card {
      padding: 24px 16px;
    }

    .header h1 {
      font-size: 1.3rem;
    }

    .input-wrap input,
    .input-wrap textarea {
      padding: 12px 12px 12px 36px;
      font-size: 0.9rem;
    }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<div class="container">
  <div class="card" id="card">

    <div class="header">
      <div class="badge">👋 Let's talk</div>
      <h1>Contactez-nous</h1>
      <p>Une question&nbsp;? Un projet&nbsp;? Écrivez-nous&nbsp;!</p>
    </div>

    <form id="form" class="form-body" novalidate>
      <div class="form-group">
        <label for="name">Nom complet</label>
        <div class="input-wrap" id="name-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="name" placeholder="Jean Dupont" required>
        </div>
        <div class="error-text" id="name-error">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          Veuillez entrer votre nom
        </div>
      </div>

      <div class="form-group">
        <label for="email">Adresse email</label>
        <div class="input-wrap" id="email-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M22 4L12 13 2 4"/>
          </svg>
          <input type="email" id="email" placeholder="jean@exemple.fr" required>
        </div>
        <div class="error-text" id="email-error">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          Adresse email invalide
        </div>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <div class="input-wrap" id="message-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <textarea id="message" placeholder="Bonjour, j'aimerais..." required></textarea>
        </div>
        <div class="error-text" id="message-error">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          Le message ne peut pas être vide
        </div>
      </div>

      <button type="submit" class="btn" id="submit-btn">
        <span class="btn-text">Envoyer le message</span>
        <span class="arrow">→</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div class="success-msg" id="success-msg">
      <div class="check">✓</div>
      <h3>Message envoyé&nbsp;!</h3>
      <p>Nous vous répondrons dans les plus brefs délais.</p>
    </div>

  </div>
</div>

<script>
  const form = document.getElementById('form');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const messageInput = document.getElementById('message');
  const nameWrap = document.getElementById('name-wrap');
  const emailWrap = document.getElementById('email-wrap');
  const messageWrap = document.getElementById('message-wrap');
  const nameError = document.getElementById('name-error');
  const emailError = document.getElementById('email-error');
  const messageError = document.getElementById('message-error');
  const submitBtn = document.getElementById('submit-btn');
  const successMsg = document.getElementById('success-msg');
  const formBody = document.querySelector('.form-body');

  function setStatus(wrap, error, status, msg) {
    wrap.classList.remove('error', 'success');
    error.classList.remove('show');
    if (status === 'error') {
      wrap.classList.add('error');
      if (msg) error.classList.add('show');
    } else if (status === 'success') {
      wrap.classList.add('success');
    }
  }

  function validateName() {
    const v = nameInput.value.trim();
    if (!v) {
      setStatus(nameWrap, nameError, 'error', true);
      return false;
    }
    if (v.length < 2) {
      nameError.querySelector('svg').insertAdjacentHTML('afterend', ' ');
      setStatus(nameWrap, nameError, 'error', true);
      return false;
    }
    setStatus(nameWrap, nameError, 'success');
    return true;
  }

  function validateEmail() {
    const v = emailInput.value.trim();
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!v || !re.test(v)) {
      setStatus(emailWrap, emailError, 'error', true);
      return false;
    }
    setStatus(emailWrap, emailError, 'success');
    return true;
  }

  function validateMessage() {
    const v = messageInput.value.trim();
    if (!v) {
      setStatus(messageWrap, messageError, 'error', true);
      return false;
    }
    if (v.length < 5) {
      setStatus(messageWrap, messageError, 'error', true);
      return false;
    }
    setStatus(messageWrap, messageError, 'success');
    return true;
  }

  [nameInput, emailInput, messageInput].forEach((input, i) => {
    const validators = [validateName, validateEmail, validateMessage];
    input.addEventListener('blur', () => validators[i]());
    input.addEventListener('input', () => {
      if (input.closest('.error')) validators[i]();
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const okName = validateName();
    const okEmail = validateEmail();
    const okMessage = validateMessage();

    if (!okName || !okEmail || !okMessage) return;

    submitBtn.disabled = true;
    submitBtn.classList.add('loading');

    await new Promise(r => setTimeout(r, 1200));

    submitBtn.disabled = false;
    submitBtn.classList.remove('loading');

    formBody.classList.add('hidden');
    successMsg.classList.add('show');
  });
</script>
</body>
</html>
