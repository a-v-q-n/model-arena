<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .contact-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 100%;
            animation: gradientShift 5s ease infinite;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from { filter: brightness(1); }
            to { filter: brightness(1.2); }
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .form-group:focus-within label {
            color: #4ecdc4;
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #2c3e50;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.2);
            background: white;
            transform: translateY(-2px);
        }

        input:hover, textarea:hover {
            border-color: #45b7d1;
            box-shadow: 0 4px 12px rgba(69, 183, 209, 0.2);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group.error input,
        .form-group.error textarea {
            border-color: #e74c3c;
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.2);
        }

        .success-message {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .contact-info {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #e0e0e0;
        }

        .contact-info p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .social-link {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .social-link:hover {
            transform: translateY(-3px) rotate(10deg);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }

        @media (max-width: 600px) {
            .contact-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            input, textarea {
                padding: 12px;
            }

            .submit-btn {
                padding: 14px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="contact-container">
        <h1>Contactez-nous</h1>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Nom complet</label>
                <input type="text" id="name" name="name" placeholder="Votre nom" required>
                <div class="error-message" id="nameError">Veuillez entrer votre nom</div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="votre@email.com" required>
                <div class="error-message" id="emailError">Veuillez entrer un email valide</div>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Votre message..." required></textarea>
                <div class="error-message" id="messageError">Veuillez entrer votre message</div>
            </div>

            <button type="submit" class="submit-btn">Envoyer le message</button>
        </form>

        <div class="success-message" id="successMessage">
            <h3>Message envoyé !</h3>
            <p>Merci pour votre contact. Nous vous répondrons très rapidement.</p>
        </div>

        <div class="contact-info">
            <p>Ou contactez-nous directement :</p>
            <p><strong>contact@exemple.com</strong></p>
            <div class="social-links">
                <a href="#" class="social-link" title="Twitter">Tw</a>
                <a href="#" class="social-link" title="LinkedIn">Li</a>
                <a href="#" class="social-link" title="GitHub">Gh</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('contactForm');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const messageInput = document.getElementById('message');
            const successMessage = document.getElementById('successMessage');

            // Validation functions
            function validateName(name) {
                return name.trim().length >= 2;
            }

            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            function validateMessage(message) {
                return message.trim().length >= 10;
            }

            // Show error function
            function showError(input, errorId, message) {
                const formGroup = input.closest('.form-group');
                const errorElement = document.getElementById(errorId);
                formGroup.classList.add('error');
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }

            // Hide error function
            function hideError(input, errorId) {
                const formGroup = input.closest('.form-group');
                const errorElement = document.getElementById(errorId);
                formGroup.classList.remove('error');
                errorElement.style.display = 'none';
            }

            // Real-time validation
            nameInput.addEventListener('input', function() {
                if (validateName(this.value)) {
                    hideError(this, 'nameError');
                }
            });

            emailInput.addEventListener('input', function() {
                if (validateEmail(this.value)) {
                    hideError(this, 'emailError');
                }
            });

            messageInput.addEventListener('input', function() {
                if (validateMessage(this.value)) {
                    hideError(this, 'messageError');
                }
            });

            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                let isValid = true;

                // Validate name
                if (!validateName(nameInput.value)) {
                    showError(nameInput, 'nameError', 'Veuillez entrer votre nom (minimum 2 caractères)');
                    isValid = false;
                }

                // Validate email
                if (!validateEmail(emailInput.value)) {
                    showError(emailInput, 'emailError', 'Veuillez entrer un email valide');
                    isValid = false;
                }

                // Validate message
                if (!validateMessage(messageInput.value)) {
                    showError(messageInput, 'messageError', 'Veuillez entrer votre message (minimum 10 caractères)');
                    isValid = false;
                }

                if (isValid) {
                    // Hide form and show success message
                    form.style.display = 'none';
                    successMessage.style.display = 'block';
                    
                    // Reset form after 3 seconds
                    setTimeout(() => {
                        form.reset();
                        form.style.display = 'block';
                        successMessage.style.display = 'none';
                    }, 3000);
                }
            });

            // Add focus animations
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.style.transform = 'translateY(-2px)';
                });
                
                input.addEventListener('blur', function() {
                    this.style.transform = 'translateY(0)';
                });
            });
        });
    </script>
</body>
</html>
