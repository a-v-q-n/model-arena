<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formulaire de contact • Chroma</title>
<style>
  :root {
    --c1: #ff006e;
    --c2: #fb5607;
    --c3: #ffbe0b;
    --c4: #3a86ff;
    --c5: #8338ec;
    --bg: #0f0c29;
    --card: rgba(255, 255, 255, 0.08);
    --text: #f8f9ff;
    --muted: rgba(248, 249, 255, 0.65);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg), #302b63, #24243e);
    background-size: 200% 200%;
    animation: bgShift 18s ease infinite;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    z-index: 0;
    animation: float 14s ease-in-out infinite;
  }
  .blob.b1 { width: 320px; height: 320px; background: var(--c1); top: -80px; left: -60px; }
  .blob.b2 { width: 280px; height: 280px; background: var(--c4); bottom: -70px; right: -50px; animation-delay: -4s; }
  .blob.b3 { width: 240px; height: 240px; background: var(--c5); top: 40%; right: 30%; animation-delay: -8s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0) scale(1); }
    50%      { transform: translateY(-30px) translateX(20px) scale(1.1); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: var(--card);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 28px;
    padding: 40px 36px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--c1), var(--c5));
    color: #fff;
    margin-bottom: 16px;
  }

  h1 {
    font-size: clamp(26px, 6vw, 36px);
    line-height: 1.1;
    margin-bottom: 8px;
    background: linear-gradient(90deg, var(--c3), var(--c2), var(--c1), var(--c5), var(--c4));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hue 8s linear infinite;
  }

  @keyframes hue {
    to { background-position: 300% 0; }
  }

  p.sub {
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 15px;
  }

  .field {
    margin-bottom: 22px;
    position: relative;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    color: var(--muted);
  }

  .input-wrap { position: relative; }

  input, textarea {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, transform 0.15s ease;
  }

  textarea { resize: vertical; min-height: 120px; }

  input::placeholder, textarea::placeholder { color: rgba(248, 249, 255, 0.4); }

  input:hover, textarea:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
  }

  input:focus, textarea:focus {
    border-color: var(--c3);
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 0 0 4px rgba(255, 190, 11, 0.18);
    transform: translateY(-2px);
  }

  .field.error input, .field.error textarea {
    border-color: var(--c1);
    box-shadow: 0 0 0 4px rgba(255, 0, 110, 0.18);
  }

  .field.valid input, .field.valid textarea {
    border-color: #06d6a0;
    box-shadow: 0 0 0 4px rgba(6, 214, 160, 0.18);
  }

  .msg {
    font-size: 12px;
    margin-top: 6px;
    min-height: 16px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .field.error .msg { color: var(--c1); opacity: 1; transform: translateY(0); }
  .field.valid .msg.ok { color: #06d6a0; opacity: 1; transform: translateY(0); }

  .btn {
    width: 100%;
    border: none;
    cursor: pointer;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
    border-radius: 14px;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c5), var(--c4));
    background-size: 250% 100%;
    background-position: 0% 50%;
    box-shadow: 0 10px 30px rgba(255, 0, 110, 0.35);
    transition: background-position 0.5s ease, transform 0.15s ease, box-shadow 0.25s ease;
  }

  .btn:hover {
    background-position: 100% 50%;
    transform: translateY(-3px);
    box-shadow: 0 14px 38px rgba(131, 56, 236, 0.45);
  }
  .btn:active { transform: translateY(0) scale(0.98); }

  .success {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 14px;
    background: linear-gradient(90deg, rgba(6,214,160,0.18), rgba(58,134,255,0.18));
    border: 1px solid rgba(6, 214, 160, 0.45);
    color: #aef7e0;
    font-size: 14px;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .success.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 480px) {
    .card { padding: 30px 22px; border-radius: 22px; }
    body { padding: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="card">
    <span class="badge">Contact</span>
    <h1>Parlons ensemble ✦</h1>
    <p class="sub">Un projet, une idée, une question ? Écris-moi, je réponds vite.</p>

    <form id="contactForm" novalidate>
      <div class="field" id="f-name">
        <label for="name">Nom</label>
        <div class="input-wrap">
          <input type="text" id="name" name="name" placeholder="Ton prénom ou pseudo" autocomplete="name" />
        </div>
        <div class="msg" data-error="Merci d'indiquer ton nom."></div>
      </div>

      <div class="field" id="f-email">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="toi@exemple.com" autocomplete="email" />
        </div>
        <div class="msg" data-error="Entre une adresse email valide."></div>
      </div>

      <div class="field" id="f-message">
        <label for="message">Message</label>
        <div class="input-wrap">
          <textarea id="message" name="message" placeholder="Dis-moi tout..."></textarea>
        </div>
        <div class="msg" data-error="Ton message doit faire au moins 10 caractères."></div>
      </div>

      <button type="submit" class="btn">Envoyer le message →</button>
      <div class="success" id="success">✓ Message envoyé ! Merci, je te réponds dès que possible.</div>
    </form>
  </main>

<script>
  const form = document.getElementById("contactForm");
  const success = document.getElementById("success");

  const fields = {
    name: {
      el: document.getElementById("f-name"),
      input: document.getElementById("name"),
      validate: (v) => v.trim().length >= 2,
    },
    email: {
      el: document.getElementById("f-email"),
      input: document.getElementById("email"),
      validate: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()),
    },
    message: {
      el: document.getElementById("f-message"),
      input: document.getElementById("message"),
      validate: (v) => v.trim().length >= 10,
    },
  };

  function setFeedback(key, valid, touched) {
    const f = fields[key];
    f.el.classList.toggle("error", touched && !valid);
    f.el.classList.toggle("valid", touched && valid);
  }

  Object.entries(fields).forEach(([key, f]) => {
    f.input.addEventListener("input", () => {
      const valid = f.validate(f.input.value);
      setFeedback(key, valid, f.input.value.length > 0);
    });
    f.input.addEventListener("blur", () => {
      setFeedback(key, f.validate(f.input.value), true);
    });
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    let allValid = true;
    Object.entries(fields).forEach(([key, f]) => {
      const valid = f.validate(f.input.value);
      setFeedback(key, valid, true);
      if (!valid) allValid = false;
    });

    if (!allValid) {
      success.classList.remove("show");
      const firstError = document.querySelector(".field.error input, .field.error textarea");
      if (firstError) firstError.focus();
      return;
    }

    success.classList.add("show");
    form.reset();
    Object.values(fields).forEach((f) => {
      f.el.classList.remove("valid", "error");
    });
  });
</script>
</body>
</html>
