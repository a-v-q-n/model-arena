<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Fireworks 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255, 200, 0, 0.8);
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">⚽ Football Fireworks ⚽</div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let football;
        const fireworks = [];
        const stars = [];

        let lastFireworkTime = 0;
        const fireworkInterval = 600;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000011, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1;
            controls.minDistance = 5;
            controls.maxDistance = 30;
            controls.target.set(0, 2, 0);

            createStarfield();
            createGround();
            createFootball();
            createLights();
            createInitialFireworks();

            window.addEventListener('resize', onWindowResize);
        }

        function createStarfield() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 2000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                const radius = 100 + Math.random() * 200;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = Math.abs(radius * Math.cos(phi));
                positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);

                const color = new THREE.Color();
                color.setHSL(0.1 + Math.random() * 0.2, 0.2 + Math.random() * 0.3, 0.7 + Math.random() * 0.3);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                sizes[i] = 0.5 + Math.random() * 1.5;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const starMaterial = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });

            const starField = new THREE.Points(starGeometry, starMaterial);
            scene.add(starField);
        }

        function createGround() {
            const groundGeometry = new THREE.CircleGeometry(50, 64);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a472a,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);

            const ringGeometry = new THREE.RingGeometry(8, 12, 64);
            const ringMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.5,
                metalness: 0.3,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -0.49;
            ring.receiveShadow = true;
            scene.add(ring);

            for (let i = 0; i < 4; i++) {
                const lineGeometry = new THREE.BoxGeometry(0.1, 0.02, 8);
                const lineMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeometry, lineMaterial);
                line.rotation.y = (i * Math.PI) / 2;
                line.position.y = -0.48;
                line.receiveShadow = true;
                scene.add(line);
            }
        }

        function createFootball() {
            const footballGroup = new THREE.Group();

            const ballGeometry = new THREE.IcosahedronGeometry(1.5, 2);
            const positions = ballGeometry.attributes.position;
            const normals = ballGeometry.attributes.normal;

            const faceCount = positions.count / 3;
            const faceColors = new Float32Array(positions.count * 3);

            for (let i = 0; i < faceCount; i++) {
                const center = new THREE.Vector3();
                for (let j = 0; j < 3; j++) {
                    center.x += positions.getX(i * 3 + j);
                    center.y += positions.getY(i * 3 + j);
                    center.z += positions.getZ(i * 3 + j);
                }
                center.divideScalar(3);
                center.normalize();

                const isPentagon = Math.random() < 0.35;
                const color = isPentagon ? new THREE.Color(0x111111) : new THREE.Color(0xffffff);

                for (let j = 0; j < 3; j++) {
                    faceColors[(i * 3 + j) * 3] = color.r;
                    faceColors[(i * 3 + j) * 3 + 1] = color.g;
                    faceColors[(i * 3 + j) * 3 + 2] = color.b;
                }
            }

            ballGeometry.setAttribute('color', new THREE.BufferAttribute(faceColors, 3));

            const ballMaterial = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.4,
                metalness: 0.1,
                flatShading: true
            });

            football = new THREE.Mesh(ballGeometry, ballMaterial);
            football.position.y = 2;
            football.castShadow = true;
            football.receiveShadow = true;

            const blackMaterial = new THREE.MeshStandardMaterial({
                color: 0x111111,
                roughness: 0.3,
                metalness: 0.2
            });

            for (let i = 0; i < 12; i++) {
                const pentagonGeometry = new THREE.CircleGeometry(0.25, 5);
                const pentagon = new THREE.Mesh(pentagonGeometry, blackMaterial);

                const phi = Math.acos(-1 + (2 * i) / 12);
                const theta = Math.sqrt(12 * Math.PI) * phi;

                pentagon.position.set(
                    1.51 * Math.sin(phi) * Math.cos(theta),
                    1.51 * Math.cos(phi),
                    1.51 * Math.sin(phi) * Math.sin(theta)
                );
                pentagon.lookAt(0, 0, 0);
                pentagon.rotateY(Math.PI);
                pentagon.castShadow = true;
                football.add(pentagon);
            }

            const stitchGeometry = new THREE.TorusGeometry(1.5, 0.02, 4, 32);
            const stitchMaterial = new THREE.MeshStandardMaterial({ color: 0x222222 });
            for (let i = 0; i < 5; i++) {
                const stitch = new THREE.Mesh(stitchGeometry, stitchMaterial);
                stitch.rotation.x = (i * Math.PI) / 5;
                stitch.rotation.y = (i * Math.PI) / 7;
                football.add(stitch);
            }

            scene.add(football);
        }

        function createLights() {
            const ambientLight = new THREE.AmbientLight(0x223344, 0.4);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0xaabbcc, 0.8);
            moonLight.position.set(10, 20, 10);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048;
            moonLight.shadow.mapSize.height = 2048;
            moonLight.shadow.camera.near = 0.5;
            moonLight.shadow.camera.far = 50;
            moonLight.shadow.camera.left = -15;
            moonLight.shadow.camera.right = 15;
            moonLight.shadow.camera.top = 15;
            moonLight.shadow.camera.bottom = -15;
            scene.add(moonLight);

            const spotLight = new THREE.SpotLight(0xffaa44, 1.5, 30, Math.PI / 4, 0.5, 1);
            spotLight.position.set(-5, 10, 5);
            spotLight.castShadow = true;
            scene.add(spotLight);

            const rimLight = new THREE.PointLight(0x4466ff, 0.8, 20);
            rimLight.position.set(5, 3, -5);
            scene.add(rimLight);

            const moonGeometry = new THREE.SphereGeometry(3, 32, 32);
            const moonMaterial = new THREE.MeshBasicMaterial({ color: 0xffffee });
            const moon = new THREE.Mesh(moonGeometry, moonMaterial);
            moon.position.set(30, 40, -50);
            scene.add(moon);
        }

        function createInitialFireworks() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => createFirework(), i * 800);
            }
        }

        function createFirework() {
            const colors = [
                [1, 0.2, 0.2],
                [0.2, 1, 0.2],
                [0.2, 0.2, 1],
                [1, 1, 0.2],
                [1, 0.2, 1],
                [0.2, 1, 1],
                [1, 0.5, 0],
                [0.5, 0, 1],
                [0, 1, 0.5],
                [1, 0.8, 0.2]
            ];

            const color = colors[Math.floor(Math.random() * colors.length)];
            const launchX = (Math.random() - 0.5) * 20;
            const launchZ = (Math.random() - 0.5) * 20;
            const explodeY = 8 + Math.random() * 12;

            const firework = {
                phase: 'launch',
                position: new THREE.Vector3(launchX, -2, launchZ),
                targetY: explodeY,
                speed: 0.3 + Math.random() * 0.2,
                color: color,
                particles: [],
                trail: [],
                lifetime: 0,
                maxLifetime: 3 + Math.random() * 2,
                sparkle: []
            };

            const trailGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const trailMaterial = new THREE.MeshBasicMaterial({
                color: new THREE.Color(color[0], color[1], color[2]),
                transparent: true,
                opacity: 0.8
            });
            const trailMesh = new THREE.Mesh(trailGeometry, trailMaterial);
            trailMesh.position.copy(firework.position);
            scene.add(trailMesh);
            firework.trailMesh = trailMesh;

            fireworks.push(firework);
        }

        function explodeFirework(firework) {
            const particleCount = 80 + Math.floor(Math.random() * 60);
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];
            const lifetimes = [];

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = firework.position.x;
                positions[i * 3 + 1] = firework.position.y;
                positions[i * 3 + 2] = firework.position.z;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 0.05 + Math.random() * 0.15;

                velocities.push(new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * speed,
                    Math.sin(phi) * Math.sin(theta) * speed,
                    Math.cos(phi) * speed
                ));

                lifetimes.push(0.5 + Math.random() * 1.5);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: new THREE.Color(firework.color[0], firework.color[1], firework.color[2]),
                size: 0.15,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            firework.phase = 'explode';
            firework.particleSystem = particles;
            firework.velocities = velocities;
            firework.lifetimes = lifetimes;
            firework.particleAge = 0;

            createSparkles(firework);
        }

        function createSparkles(firework) {
            const sparkleCount = 30;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(sparkleCount * 3);
            const velocities = [];

            for (let i = 0; i < sparkleCount; i++) {
                positions[i * 3] = firework.position.x;
                positions[i * 3 + 1] = firework.position.y;
                positions[i * 3 + 2] = firework.position.z;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 0.02 + Math.random() * 0.06;

                velocities.push(new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * speed,
                    Math.cos(phi) * speed * 0.5,
                    Math.sin(phi) * Math.sin(theta) * speed
                ));
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: new THREE.Color(
                    Math.min(1, firework.color[0] + 0.3),
                    Math.min(1, firework.color[1] + 0.3),
                    Math.min(1, firework.color[2] + 0.3)
                ),
                size: 0.08,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const sparkles = new THREE.Points(geometry, material);
            scene.add(sparkles);

            firework.sparkleSystem = sparkles;
            firework.sparkleVelocities = velocities;
        }

        function updateFireworks(delta) {
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];

                if (fw.phase === 'launch') {
                    fw.position.y += fw.speed;
                    fw.trailMesh.position.y = fw.position.y;

                    const trailOpacity = Math.min(1, (fw.targetY - fw.position.y) / fw.targetY);
                    fw.trailMesh.material.opacity = trailOpacity * 0.8;

                    if (fw.position.y >= fw.targetY) {
                        scene.remove(fw.trailMesh);
                        fw.trailMesh.geometry.dispose();
                        fw.trailMesh.material.dispose();
                        explodeFirework(fw);
                    }
                } else if (fw.phase === 'explode') {
                    fw.particleAge += delta;

                    const positions = fw.particleSystem.geometry.attributes.position.array;
                    for (let j = 0; j < fw.velocities.length; j++) {
                        positions[j * 3] += fw.velocities[j].x;
                        positions[j * 3 + 1] += fw.velocities[j].y - 0.001;
                        positions[j * 3 + 2] += fw.velocities[j].z;

                        fw.velocities[j].multiplyScalar(0.98);
                    }
                    fw.particleSystem.geometry.attributes.position.needsUpdate = true;

                    const progress = fw.particleAge / fw.maxLifetime;
                    fw.particleSystem.material.opacity = Math.max(0, 1 - progress);

                    if (fw.sparkleSystem) {
                        const sparklePositions = fw.sparkleSystem.geometry.attributes.position.array;
                        for (let j = 0; j < fw.sparkleVelocities.length; j++) {
                            sparklePositions[j * 3] += fw.sparkleVelocities[j].x;
                            sparklePositions[j * 3 + 1] += fw.sparkleVelocities[j].y - 0.0005;
                            sparklePositions[j * 3 + 2] += fw.sparkleVelocities[j].z;

                            fw.sparkleVelocities[j].multiplyScalar(0.99);
                        }
                        fw.sparkleSystem.geometry.attributes.position.needsUpdate = true;
                        fw.sparkleSystem.material.opacity = Math.max(0, 1 - progress * 1.2);
                    }

                    if (fw.particleAge >= fw.maxLifetime) {
                        scene.remove(fw.particleSystem);
                        fw.particleSystem.geometry.dispose();
                        fw.particleSystem.material.dispose();

                        if (fw.sparkleSystem) {
                            scene.remove(fw.sparkleSystem);
                            fw.sparkleSystem.geometry.dispose();
                            fw.sparkleSystem.material.dispose();
                        }

                        fireworks.splice(i, 1);
                    }
                }
            }
        }

        function animate(time) {
            requestAnimationFrame(animate);

            const delta = 0.016;

            if (football) {
                football.rotation.y += 0.005;
                football.position.y = 2 + Math.sin(time * 0.001) * 0.1;
            }

            if (time - lastFireworkTime > fireworkInterval) {
                createFirework();
                lastFireworkTime = time;
            }

            updateFireworks(delta);

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
